name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API .NET
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ProvaDagua.slnx
      - run: dotnet build ProvaDagua.slnx -c Release --no-restore
      - run: dotnet test ProvaDagua.slnx -c Release --no-build --logger "trx;LogFileName=resultados.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-testes
          path: api/TestResults

  ai:
    name: IA Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
      - name: Métricas do modelo
        run: |
          python ../iot/generate_dataset.py --output /tmp/readings.csv
          python train.py --data /tmp/readings.csv --model-output /tmp/model.joblib --metrics-output /tmp/metrics.json > /dev/null
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("/tmp/metrics.json"))
          print("## Métricas da IA (dados simulados)\n")
          print("| | Regra fixa | Modelo |")
          print("|---|---|---|")
          for key in ["accuracy", "precision_flood", "recall_flood", "f1_flood"]:
              print(f"| {key} | {m['baseline'][key]:.1%} | {m['model'][key]:.1%} |")
          print(f"| falsos alarmes | {m['baseline']['confusion_matrix [flood, noise]'][1][0]} | {m['model']['confusion_matrix [flood, noise]'][1][0]} |")
          EOF

  iot:
    name: Simulador IoT
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: iot/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  web:
    name: Site (unitários)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  web-e2e:
    name: Site (navegador)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: web/test-results

  integration:
    name: Sistema completo (docker compose)
    runs-on: ubuntu-latest
    needs: [api, ai, iot, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Sobe todos os serviços
        run: docker compose up --build -d
      - name: Alagamento e splash de ponta a ponta
        run: python tests/smoke/smoke.py --site http://localhost:3000 --timeout 300
      - name: Logs dos serviços
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Desliga tudo
        if: always()
        run: docker compose down -v